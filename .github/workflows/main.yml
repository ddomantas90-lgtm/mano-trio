name: Build Trio (No Certificates)

on:
workflow_dispatch:

jobs:
build:
runs-on: macos-14
steps:
- name: Checkout Repository
uses: actions/checkout@v4
with:
submodules: recursive

- name: Select Xcode Version
run: sudo xcode-select -s /Applications/Xcode_15.4.app

- name: Install Dependencies
run: |
xcodebuild -resolvePackageDependencies

- name: Build App (Debug Mode)
run: |
xcodebuild -project Trio.xcodeproj \
-scheme Trio \
-configuration Debug \
-sdk iphoneos \
-allowProvisioningUpdates \
CODE_SIGNING_ALLOWED=NO \
clean build

- name: Package IPA
run: |
mkdir -p Payload
mv build/Debug-iphoneos/Trio.app Payload/
zip -r Trio.ipa Payload/

- name: Upload IPA Artifact
uses: actions/upload-artifact@v4
with:
name: Trio-App
path: Trio.ipa
